<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Job Eligibility Checker</title>
<link rel="stylesheet" href="style.css">
 
</head>
<body>

  <div class="container">
    <h2>Job Eligibility Checker</h2>

    <div class="option">
      <input type="radio" name="education" value="Illiterate" id="illiterate">
      <label for="illiterate">Illiterate</label>
    </div>

    <div class="option">
      <input type="radio" name="education" value="HighSchool" id="highschool">
      <label for="highschool">HighSchool</label>
    </div>

    <div class="option">
      <input type="radio" name="education" value="UG" id="ug">
      <label for="ug">UG</label>
    </div>

    <div class="option">
      <input type="radio" name="education" value="PG" id="pg">
      <label for="pg">PG</label>
    </div>

    <div class="option">
      <input type="radio" name="education" value="Doctorate" id="doctorate">
      <label for="doctorate">Doctorate</label>
    </div>

    <button onclick="checkEligibility()">Check Eligibility</button>

    <div id="result"></div>
  </div>

  <script src="script.js">
   
  </script>

</body>
</html>
