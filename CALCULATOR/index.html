<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css">
    <title>Calculator Without Buttons</title>


</head>

<body>

    <div class="calculator">
        <h1>Calculator Without Buttons</h1>

        <input type="text" id="expression" placeholder="Enter expression e.g. 5+9">

        <button onclick="calculate()">Calculate</button>

        <div id="result"></div>
    </div>

    <script src="script.js"></script>


</body>

</html>
